# App + local LLM. `docker compose up --build`, then open http://localhost:8080
services:
  ollama:
    build:
      context: ./ollama
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
    image: ghcr.io/alulema/trip-planner-ollama:latest
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: ghcr.io/alulema/trip-planner:latest
    ports:
      - "8080:8080"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
    depends_on:
      ollama:
        condition: service_healthy
